<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login | siniCOOKIeSS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff5e6; /* putih ke orange muda */
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0px 8px 20px rgba(255, 153, 0, 0.3);
      text-align: center;
      width: 300px;
    }
    .login-box h2 {
      margin-bottom: 20px;
      color: #ff6600;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ffcc99;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff6600;
      border: none;
      color: white;
      font-size: 18px;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #e65c00;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Masuk siniCOOKIeSS</h2>
  <input type="text" id="nama" placeholder="Nama">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Masuk</button>
  <div class="footer">Cookies is happiness 🍪</div>
</div>

<script>
function login() {
  var nama = document.getElementById("nama").value;
  var password = document.getElementById("password").value;

  if (nama && password) {
    alert("Login berhasil, selamat datang " + nama + "!");
    window.location.href = "index.html"; // Arahkan ke halaman utama
  } else {
    alert("Silakan isi nama dan password!");
  }
}
</script>

</body>
</html>
